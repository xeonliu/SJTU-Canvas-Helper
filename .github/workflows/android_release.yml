name: Android release

on:
  push:
    tags:
      - "android-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./android

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build-tools
        run: |
          sdkmanager "build-tools;34.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Validate signing secrets
        run: |
          test -n "${{ secrets.ANDROID_SIGNING_KEY }}" || (echo "Missing secret: ANDROID_SIGNING_KEY" && exit 1)
          test -n "${{ secrets.ANDROID_KEY_ALIAS }}" || (echo "Missing secret: ANDROID_KEY_ALIAS" && exit 1)
          test -n "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" || (echo "Missing secret: ANDROID_KEYSTORE_PASSWORD" && exit 1)
          test -n "${{ secrets.ANDROID_KEY_PASSWORD }}" || (echo "Missing secret: ANDROID_KEY_PASSWORD" && exit 1)

      - name: Build Release APK
        run: gradle assembleRelease --no-daemon

      - name: Decode keystore
        run: |
          echo "${{ secrets.ANDROID_SIGNING_KEY }}" | base64 --decode > app/release-keystore.jks

      - name: Sign Release APK
        run: |
          APK_UNSIGNED="app/build/outputs/apk/release/app-release-unsigned.apk"
          APK_SIGNED="app/build/outputs/apk/release/app-release-signed.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/34.0.0/apksigner"

          test -f "$APK_UNSIGNED" || (echo "Unsigned APK not found: $APK_UNSIGNED" && exit 1)
          "$APKSIGNER" sign \
            --ks app/release-keystore.jks \
            --ks-key-alias "${{ secrets.ANDROID_KEY_ALIAS }}" \
            --ks-pass pass:"${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            --key-pass pass:"${{ secrets.ANDROID_KEY_PASSWORD }}" \
            --out "$APK_SIGNED" \
            "$APK_UNSIGNED"

          "$APKSIGNER" verify --verbose "$APK_SIGNED"

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-release-apk
          path: android/app/build/outputs/apk/release/app-release-signed.apk

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/android-v')
        uses: softprops/action-gh-release@6cbd405e2c4e67a21c47fa9e383d020e4e28b836 # 2.3.3
        with:
          files: android/app/build/outputs/apk/release/app-release-signed.apk
          draft: false
          prerelease: false